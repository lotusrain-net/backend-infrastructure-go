name: backend-infrastructure-go

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  SERVICE_NAME: ${SERVICE_NAME:-backend-infrastructure-go}
  HTTP_ADDR: :8080
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
  MIGRATIONS_SOURCE: file:///app/migrations
  REDIS_ADDR: redis:6379
  REDIS_TLS: "false"
  ALLOW_INSECURE_INTERNAL_TRANSPORT: "true"
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
  SCHEDULER_REFRESH_INTERVAL: ${SCHEDULER_REFRESH_INTERVAL:-30s}
  WORKER_METRICS_ADDR: :9090

x-api-environment: &api-environment
  <<: *app-environment
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  AUTHENTICATION_KEY: ${AUTHENTICATION_KEY:?AUTHENTICATION_KEY is required}
  AUTHENTICATION_PEPPER: ${AUTHENTICATION_PEPPER:?AUTHENTICATION_PEPPER is required}
  RECOVERY_CODE_TTL: ${RECOVERY_CODE_TTL:-720h}
  SMTP_ENABLED: ${SMTP_ENABLED:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

x-admin-seed-environment: &admin-seed-environment
  <<: *app-environment
  ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
  ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}

x-app: &app
  image: backend-infrastructure-go:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      IMAGE_REGISTRY: ${IMAGE_REGISTRY:-public.ecr.aws/docker}
      GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
      GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
  user: "10001:10001"
  environment: *app-environment
  networks:
    - backend
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  postgres:
    image: ${IMAGE_REGISTRY:-public.ecr.aws/docker}/library/postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: ${IMAGE_REGISTRY:-public.ecr.aws/docker}/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    <<: *app
    entrypoint: ["/app/migrate"]
    command: ["up"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  seed-admin:
    <<: *app
    entrypoint: ["/app/seed-admin"]
    environment: *admin-seed-environment
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    entrypoint: ["/app/api"]
    environment: *api-environment
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-admin:
        condition: service_completed_successfully

  web:
    image: backend-infrastructure-go-web:${IMAGE_TAG:-local}
    build:
      context: ../web
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-public.ecr.aws/docker}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/healthz').then((response)=>{if(!response.ok) process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *app
    entrypoint: ["/app/worker"]
    expose:
      - "9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    entrypoint: ["/app/scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
    internal: true
  edge:
