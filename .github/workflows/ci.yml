name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Download modules
        env:
          GOWORK: off
        run: go mod download
      - name: Verify Go module boundaries
        shell: pwsh
        run: ./scripts/verify-go-module-boundaries.ps1
      - name: Unit and package tests
        env:
          GOWORK: off
        run: go test -count=1 ./...
      - name: Race detector
        env:
          GOWORK: off
        run: go test -race -count=1 ./...
      - name: Vet
        env:
          GOWORK: off
        run: go vet ./...
      - name: Build all commands
        env:
          GOWORK: off
        run: go build ./...
      - name: External consumer fixture
        working-directory: tests/consumer
        env:
          GOWORK: off
        run: go test ./...
      - name: Staticcheck
        env:
          GOWORK: off
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        env:
          GOWORK: off
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Verify generated sqlc output
        shell: pwsh
        run: ./db/verify-sqlc.ps1
      - name: Verify delivery configuration and secrets
        shell: pwsh
        run: ./scripts/verify-delivery.ps1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080
        run: npm run build
      - name: Package lint and dry-run pack
        run: npm run check:package
      - name: External package consumers
        run: npm run test:package-consumers

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: backend_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GOWORK: off
      MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test?sslmode=disable
      AUTH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Migration up/down/up and seed idempotency
        run: go test -count=1 ./pkg/migrations
      - name: Authentication PostgreSQL integration tests
        run: |
          test -n "$AUTH_TEST_DATABASE_URL"
          go test -race -count=1 -v ./tests/integration ./tests/e2e

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Verify delivery configuration
        shell: pwsh
        run: ./scripts/verify-delivery.ps1
      - name: Build and smoke test Compose stack
        shell: pwsh
        run: ./scripts/docker-smoke.ps1
