              $ref: '#/components/schemas/SecurityProof'
  /api/v1/users/me/security/totp/confirm:
    post:
      operationId: confirmTOTP
      description: Missing or expired sessions return 401 and may be refreshed. Invalid or expired proof returns 422 with data.proof; do not refresh or automatically retry that proof.
      summary: Confirm enrollment and display ten one-time recovery codes exactly once.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        '200':
          description: >-
            Confirm enrollment and display ten one-time recovery codes exactly
            once.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPRecoveryCodesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
