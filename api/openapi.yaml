  /api/v1/users/me/security/totp/enroll:
    post:
      operationId: enrollTOTP
      description: Missing or expired sessions return 401 and may be refreshed. Invalid current-password proof returns 422 with data.proof; do not refresh or automatically retry that proof.
      summary: >-
        Verify current password and begin ten-minute TOTP enrollment. Generate QR
        locally from otpauth_uri; do not persist or log secrets.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        '200':
          description: >-
            Verify current password and begin ten-minute TOTP enrollment. Generate
            QR locally from otpauth_uri; do not persist or log secrets.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPEnrollmentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
