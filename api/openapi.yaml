openapi: 3.1.0
info:
  title: Backend Infrastructure API
  version: 0.2.0
  description: HTTP contract for the reusable Go backend foundation.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      security: []
      responses:
        "200":
          description: All required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /metrics:
    get:
      operationId: getMetrics
      summary: Export Prometheus metrics
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for an access and refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: HttpOnly access and refresh token cookies. The access cookie expires with the JWT access token.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Pragma:
              $ref: "#/components/headers/Pragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: Rotate a refresh token and issue a new token pair
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token rotation succeeded.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly access and refresh token cookies. The access cookie expires with the JWT access token.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Pragma:
              $ref: "#/components/headers/Pragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the supplied refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout succeeded.
          headers:
            Set-Cookie:
              description: Expired access and refresh token cookies.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Pragma:
              $ref: "#/components/headers/Pragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/me/preferences:
    get:
      operationId: getCurrentUserPreferences
      summary: Return the authenticated user's appearance preferences
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Account appearance preferences, or defaults when none have been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putCurrentUserPreferences
      summary: Replace the authenticated user's appearance preferences
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Account appearance preferences replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users with optional search and activation filters
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: query
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated user collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: Create a user
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userID}/active:
    patch:
      operationId: setUserActive
      summary: Activate or deactivate a user
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: User activation state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{userID}:
    patch:
      operationId: updateUser
      summary: Update a user profile
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/{userID}/password/reset:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password and revoke their sessions
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List roles
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Role collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRole
      summary: Create a custom role
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "201":
          description: Custom role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles/{roleID}:
    get:
      operationId: getRole
      summary: Return a role with its permissions
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: Role detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRole
      summary: Update a custom role or a system role description
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteRole
      summary: Delete a custom role
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: Role deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: List permissions
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Permission collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{userID}/roles/{roleID}:
    post:
      operationId: assignUserRole
      summary: Assign a role to a user
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{userID}/roles:
    put:
      operationId: replaceUserRoles
      summary: Atomically replace all roles assigned to a user
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserRolesRequest"
      responses:
        "200":
          description: User role assignments replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles/{roleID}/permissions/{permissionID}:
    post:
      operationId: grantRolePermission
      summary: Grant a permission to a role
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/PermissionID"
      responses:
        "200":
          description: Permission granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/roles/{roleID}/permissions:
    put:
      operationId: replaceRolePermissions
      summary: Atomically replace all permissions assigned to a custom role
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: Role permission assignments replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Query audit events
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: request_id
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Include events created at or after this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Include events created at or before this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit event collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/task-executions:
    get:
      operationId: listTaskExecutions
      summary: List task executions newest first
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: task_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, cancelled]
      responses:
        "200":
          description: Paginated task execution collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionPageEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: submitTaskExecution
      summary: Submit a registered task type for asynchronous execution
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSubmissionRequest"
      responses:
        "202":
          description: Task accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/task-executions/{executionID}:
    get:
      operationId: getTaskExecution
      summary: Return persisted task execution state
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      responses:
        "200":
          description: Task execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-types:
    get:
      operationId: listTaskTypes
      summary: List registered task types from the runtime catalog
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Runtime task type collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTypesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  headers:
    X-Request-ID:
      description: Correlation identifier accepted from trusted clients or generated by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cache-Control:
      description: Prevents storage of authentication responses.
      schema:
        type: string
        enum: [no-store]
    Pragma:
      description: Prevents caching by HTTP/1.0 intermediaries.
      schema:
        type: string
        enum: [no-cache]
  parameters:
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleID:
      name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionID:
      name: permissionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionID:
      name: executionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The authenticated user lacks permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PaginatedResponse:
      description: A successful paginated collection response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginatedResponse"
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          description: HTTP success status repeated for client compatibility.
        msg:
          type: string
          enum: [success]
        data: {}
    ErrorEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          description: Stable application error code retained for frontend compatibility.
        msg:
          type: string
          description: Safe public error message.
        data: {}
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    PaginationMeta:
      type: object
      required: [page, size, total, pages, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean
    PaginatedResponse:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
        msg:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items: {}
            meta:
              $ref: "#/components/schemas/PaginationMeta"
