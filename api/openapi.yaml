openapi: 3.1.0
info:
  title: Backend Infrastructure API
  version: 0.2.0
  description: HTTP contract for the reusable Go backend foundation.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      security: []
      responses:
        "200":
          description: All required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /metrics:
    get:
      operationId: getMetrics
      summary: Export Prometheus metrics
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for an access and refresh token pair
      description: >-
        If the password is valid and the account requires email verification,
        omitting email_code returns 422 with data.email_code set to required.
        Obtain an email code and resubmit the credentials with email_code.
        No session or authentication cookie is issued before verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '202':
          description: >-
            TOTP required. No cookies or tokens are issued; the challenge must remain in
            memory only.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPChallengeEnvelope'
        "200":
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: HttpOnly access and refresh token cookies. The access cookie expires with the JWT access token.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Pragma:
              $ref: "#/components/headers/Pragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: Rotate a refresh token and issue a new token pair
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token rotation succeeded.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly access and refresh token cookies. The access cookie expires with the JWT access token.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Pragma:
              $ref: "#/components/headers/Pragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the supplied refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout succeeded.
          headers:
            Set-Cookie:
              description: Expired access and refresh token cookies.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Pragma:
              $ref: "#/components/headers/Pragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/me/preferences:
    get:
      operationId: getCurrentUserPreferences
      summary: Return the authenticated user's appearance preferences
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Account appearance preferences, or defaults when none have been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putCurrentUserPreferences
      summary: Replace the authenticated user's appearance preferences
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Account appearance preferences replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users with optional search and activation filters
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: query
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated user collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: Create a user
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userID}/active:
    patch:
      operationId: setUserActive
      summary: Activate or deactivate a user
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: User activation state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{userID}:
    patch:
      operationId: updateUser
      summary: Update a user profile
      description: Email changes are forbidden while email second-factor authentication is enabled. Other profile fields can still be updated.
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/{userID}/password/reset:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password and revoke their sessions
      description: Atomically updates the password and invalidates outstanding TOTP login challenges and pending enrollment. Enabled TOTP remains required for new logins.
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List roles
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Role collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRole
      summary: Create a custom role
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "201":
          description: Custom role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles/{roleID}:
    get:
      operationId: getRole
      summary: Return a role with its permissions
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: Role detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRole
      summary: Update a custom role or a system role description
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteRole
      summary: Delete a custom role
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: Role deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: List permissions
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Permission collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{userID}/roles/{roleID}:
    post:
      operationId: assignUserRole
      summary: Assign a role to a user
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{userID}/roles:
    put:
      operationId: replaceUserRoles
      summary: Atomically replace all roles assigned to a user
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserRolesRequest"
      responses:
        "200":
          description: User role assignments replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles/{roleID}/permissions/{permissionID}:
    post:
      operationId: grantRolePermission
      summary: Grant a permission to a role
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/PermissionID"
      responses:
        "200":
          description: Permission granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/roles/{roleID}/permissions:
    put:
      operationId: replaceRolePermissions
      summary: Atomically replace all permissions assigned to a custom role
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: Role permission assignments replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Query audit events
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: request_id
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Include events created at or after this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Include events created at or before this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit event collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/task-executions:
    get:
      operationId: listTaskExecutions
      summary: List task executions newest first
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: task_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, cancelled]
      responses:
        "200":
          description: Paginated task execution collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionPageEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: submitTaskExecution
      summary: Submit a registered task type for asynchronous execution
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSubmissionRequest"
      responses:
        "202":
          description: Task accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/task-executions/{executionID}:
    get:
      operationId: getTaskExecution
      summary: Return persisted task execution state
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      responses:
        "200":
          description: Task execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-types:
    get:
      operationId: listTaskTypes
      summary: List registered task types from the runtime catalog
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Runtime task type collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTypesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/email-code:
    post:
      operationId: requestEmailCode
      summary: >-
        Request a short-lived one-time code. Unknown addresses and delivery
        or recipient failures return the same accepted response; dependency
        failures return 503.
      security: []
      responses:
        '202':
          description: >-
            Request a short-lived one-time code. Unknown addresses and delivery
            or recipient failures return the same accepted response; dependency
            failures return 503.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCodeResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Cooldown or rate limit. No account existence information is returned.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
  /api/v1/auth/register:
    post:
      operationId: register
      summary: >-
        Create a user with the default user role. No session or authentication
        cookie is issued.
      description: >-
        If registration policy requires email verification, omitting email_code
        returns 422 with data.email_code set to required. Obtain an email code
        and resubmit the registration fields with email_code. No user is created
        until verification succeeds. Invalid or expired codes return 401.
      security: []
      responses:
        '201':
          description: >-
            Create a user with the default user role. No session or authentication
            cookie is issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Cooldown or rate limit. No account existence information is returned.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/login/totp/verify:
    post:
      operationId: verifyTOTPLogin
      summary: >-
        Consume a challenge and one TOTP or recovery code, then issue
        authentication cookies.
      security: []
      responses:
        '200':
          description: >-
            Consume a challenge and one TOTP or recovery code, then issue
            authentication cookies.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
