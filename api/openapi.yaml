      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPConfirmRequest'
  /api/v1/users/me/security/totp/disable:
    post:
      operationId: disableTOTP
      description: Missing or expired sessions return 401 and may be refreshed. Invalid password or second-factor proof returns 422 with data.proof. Retries with a valid password complete session revocation even if TOTP is already disabled.
      summary: >-
        Verify current password and a code or recovery code, then disable TOTP.
        Repeating after disable is idempotent with a valid password.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        '200':
          description: >-
            Verify current password and a code or recovery code, then disable
            TOTP. Repeating after disable is idempotent with a valid password.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPDisabledEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Cooldown or rate limit. No account existence information is returned.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityProof'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  headers:
    X-Request-ID:
      description: Correlation identifier accepted from trusted clients or generated by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cache-Control:
      description: Prevents storage of authentication responses.
      schema:
        type: string
        enum: [no-store]
    Pragma:
      description: Prevents caching by HTTP/1.0 intermediaries.
      schema:
        type: string
        enum: [no-cache]
  parameters:
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleID:
      name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionID:
      name: permissionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionID:
      name: executionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The authenticated user lacks permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PaginatedResponse:
      description: A successful paginated collection response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginatedResponse"
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          description: HTTP success status repeated for client compatibility.
        msg:
          type: string
          enum: [success]
        data: {}
    ErrorEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          description: Stable application error code retained for frontend compatibility.
        msg:
          type: string
          description: Safe public error message.
        data: {}
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    PaginationMeta:
      type: object
      required: [page, size, total, pages, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean
    PaginatedResponse:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
        msg:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items: {}
            meta:
              $ref: "#/components/schemas/PaginationMeta"
    AuthenticationSettings:
      type: object
      additionalProperties: false
      required:
        - password_login_enabled
        - registration_enabled
        - registration_email_verification_required
        - allowed_email_domains
      properties:
        password_login_enabled:
          type: boolean
          default: true
        registration_enabled:
          type: boolean
          default: false
        registration_email_verification_required:
          type: boolean
          default: true
        allowed_email_domains:
          type: array
          default: []
          maxItems: 100
          items:
            type: string
            maxLength: 253
            pattern: >-
              ^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?)+$
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum:
            - register
            - login
    EmailCodeResult:
      type: object
      additionalProperties: false
      required:
        - sent
        - resend_after_seconds
      properties:
        sent:
          type: boolean
          enum:
            - true
        resend_after_seconds:
          type: integer
          default: 60
          minimum: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
        email_code: &ref_0
          type: string
          pattern: ^[0-9]{6}$
    TOTPChallenge:
      type: object
      additionalProperties: false
      required:
        - status
        - challenge_id
        - expires_in
      properties:
        status:
          type: string
          enum:
            - totp_required
        challenge_id:
          type: string
          minLength: 1
        expires_in:
          type: integer
          default: 300
          minimum: 1
    TOTPVerifyRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - challenge_id
            - code
          properties:
            challenge_id: &ref_1
              type: string
            code: *ref_0
        - type: object
          additionalProperties: false
          required:
            - challenge_id
            - recovery_code
          properties:
            challenge_id: *ref_1
            recovery_code:
              type: string
              minLength: 1
    SecurityMode:
      type: string
      enum:
        - default
        - email
        - totp
      default: default
    SecuritySettings:
      type: object
      additionalProperties: false
      required:
        - mode
        - totp_enabled
        - recovery_codes_remaining
      properties:
        recovery_codes_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Recovery codes expire at this time; null when no codes exist. Default lifetime is 30 days, configured by RECOVERY_CODE_TTL.
        mode:
          $ref: '#/components/schemas/SecurityMode'
        totp_enabled:
          type: boolean
          default: false
        recovery_codes_remaining:
          type: integer
          minimum: 0
          default: 0
    SecurityUpdate:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/SecurityMode'
    SecurityProof:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
        code: *ref_0
        recovery_code:
          type: string
          minLength: 1
    TOTPEnrollment:
      type: object
      additionalProperties: false
      required:
        - secret
        - otpauth_uri
        - expires_in
      properties:
        secret: *ref_1
        otpauth_uri:
          type: string
          format: uri
        expires_in:
          type: integer
          default: 600
    TOTPConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code: *ref_0
    TOTPRecoveryCodes:
      type: object
      additionalProperties: false
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items: *ref_1
          minItems: 10
          maxItems: 10
    TOTPDisabled:
      type: object
      additionalProperties: false
      required:
        - disabled
      properties:
        disabled:
          type: boolean
    AuthenticationSettingsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthenticationSettings'
    EmailCodeResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmailCodeResult'
    TOTPChallengeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TOTPChallenge'
    SecuritySettingsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SecuritySettings'
    TOTPEnrollmentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TOTPEnrollment'
    TOTPRecoveryCodesEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TOTPRecoveryCodes'
    TOTPDisabledEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TOTPDisabled'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        email_code:
          type: string
          pattern: '^[0-9]{6}$'
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          minimum: 1
    TokenPairEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TokenPair"
    User:
      type: object
      required: [id, email, username, display_name, is_active]
      properties:
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"
    Preferences:
      type: object
      additionalProperties: false
      required: [theme, color_mode, accent_color, font_scale, radius_scale]
      properties:
        theme:
          type: string
          enum: [enterprise, cyberpunk]
        color_mode:
          type: string
          enum: [light, dark, system]
        accent_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
        font_scale:
          type: string
          enum: [small, standard, large]
        radius_scale:
          type: string
          enum: [square, compact, rounded]
    PreferencesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Preferences"
    AuthenticatedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items:
                type: string
    AuthenticatedUserEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthenticatedUser"
    UserPageEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
        msg:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
            meta:
              $ref: "#/components/schemas/PaginationMeta"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
        display_name:
          type: string
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [email, username, display_name]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 1
        display_name:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 12
    SetActiveRequest:
      type: object
      additionalProperties: false
      required: [is_active]
      properties:
        is_active:
          type: boolean
    Role:
      type: object
      required: [id, name, description, is_system]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
    RoleDetail:
      allOf:
        - $ref: "#/components/schemas/Role"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/Permission"
    RoleRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    ReplaceUserRolesRequest:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReplaceRolePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permission_ids]
      properties:
        permission_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Permission:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    RolesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Role"
    RoleEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Role"
    RoleDetailEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RoleDetail"
    PermissionsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Permission"
    BooleanEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                type: boolean
    AuditEvent:
      type: object
      required: [id, request_id, action, result, resource_type, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        result:
          type: string
          enum: [success, failure]
        resource_type:
          type: string
        resource_id:
          type: string
        ip_address:
          type: string
          format: ip
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditPageEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
        msg:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
            meta:
              $ref: "#/components/schemas/PaginationMeta"
    TaskSubmissionRequest:
      type: object
      additionalProperties: false
      required: [task_type, payload]
      properties:
        definition_id:
          type: string
          format: uuid
        task_type:
          type: string
          description: A registered runtime task type. Retrieve supported values from GET /api/v1/task-types.
        payload:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          minLength: 1
        max_retries:
          type: integer
          minimum: 0
          maximum: 25
          default: 3
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        unique_for_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
        process_after_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 0
    TaskExecution:
      type: object
      required: [id, task_type, payload, status, attempt, processed_rows]
      properties:
        id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        task_type:
          type: string
        queue_id:
          type: string
        idempotency_key:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        attempt:
          type: integer
          minimum: 0
        processed_rows:
          type: integer
          format: int64
          minimum: 0
        error_summary:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    TaskExecutionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskExecution"
    TaskExecutionPageEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
        msg:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TaskExecution"
            meta:
              $ref: "#/components/schemas/PaginationMeta"
    TaskTypeRef:
      type: object
      required: [task_type]
      properties:
        task_type:
          type: string
    TaskTypesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TaskTypeRef"
