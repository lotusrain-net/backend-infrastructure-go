openapi: 3.1.0
info:
  title: Backend Infrastructure API
  version: 0.1.0
  description: Shared HTTP contracts for the reusable Go backend foundation.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      responses:
        "200":
          description: All required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: One or more required dependencies are unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /metrics:
    get:
      operationId: getMetrics
      summary: Export Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            text/plain:
              schema:
                type: string
components:
  headers:
    X-Request-ID:
      description: Correlation identifier accepted from trusted clients or generated by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          description: HTTP success status repeated for client compatibility.
        msg:
          type: string
          const: success
        data: {}
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorEnvelope:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          description: Stable application error code retained for frontend compatibility.
        msg:
          type: string
          description: Safe public error message.
        data: {}
    PaginationMeta:
      type: object
      required: [page, size, total, pages, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean
